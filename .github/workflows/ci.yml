name: CI

on:
  push:
  create:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  branch-names:
    name: Branch naming
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate contributor branch name
        run: node scripts/validate-branch-name.js --event

  images:
    if: github.event_name != 'create'
    name: Image loading
    runs-on: ubuntu-24.04
    # Avoid simultaneous push/PR scans overwhelming the same external hosts.
    concurrency:
      group: image-loading-${{ github.repository }}
      cancel-in-progress: false
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Test image checker against controlled browser fixtures
        run: npm run test:images:unit
      - name: Test image loading from localhost and production origins
        run: npm run test:images
      - name: Upload image failure report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: image-check-report
          path: reports/image-check-report.json
          if-no-files-found: ignore

  conventional-commits:
    if: github.event_name != 'create'
    name: Conventional Commits
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out full commit history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate contributed commit messages
        run: node scripts/validate-commit-message.js --event

  verify:
    if: github.event_name != 'create'
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Validate CYOAs and run verification checks
        run: sh scripts/check.sh
