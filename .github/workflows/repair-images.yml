name: Repair failed images

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  contents: read
  actions: read

concurrency:
  # One dedicated token is shared by all branches. Serialize its API usage.
  group: image-rehosting
  cancel-in-progress: false

jobs:
  repair:
    if: >-
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      !startsWith(github.event.workflow_run.head_branch, 'fix/image-repair-') &&
      (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'pull_request')
    name: Approve ImgChest uploads and repair PR
    environment: image-rehosting
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      # workflow_run checks out trusted default-branch code only. Source-branch
      # CYOAs are read as JSON through the API; its code is never executed here.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify the owner's approval (fail closed)
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/rehost-images.js approval
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Recheck, upload, verify replacements and propose changes
        env:
          GH_TOKEN: ${{ secrets.IMAGE_REPAIR_GITHUB_TOKEN }}
          IMGCHEST_API_TOKEN: ${{ secrets.IMGCHEST_API_TOKEN }}
        run: node scripts/rehost-images.js repair
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: image-rehosting-report
          path: image-rehosting-report.json
          if-no-files-found: ignore
